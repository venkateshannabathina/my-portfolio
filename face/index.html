  <body>
    <canvas id="portrait" aria-label="Interactive textured portrait of Tasha. Drag to orbit, scroll to zoom, double-click to reset. Press H for controls." tabindex="0"></canvas>
    <div id="loading" role="status"><span class="spinner"></span><span id="progress">Loading Tasha</span></div>
    <div id="failure" role="alert" hidden></div>
    <aside id="controls" hidden>
      <p>TASHA <span>PORTRAIT</span></p>
      <label>Exposure <input id="exposure" type="range" min="0.5" max="1.7" step="0.01" value="1.18" /></label>
      <button id="reset">Reset view</button><button id="save">Save image</button><button id="fullscreen">Fullscreen</button>
      <small>Drag to orbit · Scroll to zoom<br>Double-click to reset · H to hide controls</small>
    </aside>
    <button id="dev-toggle" aria-controls="arkit-panel" aria-expanded="false" disabled>Dev</button>
    <aside id="arkit-panel" aria-label="ARKit development controls" hidden>
      <header><div><span class="eyebrow">TASHA / DEVELOPMENT</span><h1>ARKit Face</h1></div><button data-close aria-label="Close ARKit controls">×</button></header>
      <label class="character-picker">Face<select data-character aria-label="Face"><option value="tasha">Tasha</option><option value="ada">Ada Wong</option><option value="thanos">Thanos</option></select></label>
      <p data-character-message role="status" hidden></p>
      <p data-status role="status">Loading facial rig…</p>
      <div class="dev-actions"><button data-neutral>Reset face</button><button data-demo>Play expressions</button></div>
      <div class="preset-grid" data-presets></div>
      <div class="face-options">
        <label class="check"><input data-correctives type="checkbox" checked /> Corrective shapes</label>
        <label>Smoothing <input data-smoothing aria-label="Expression smoothing" type="range" min="0" max="160" step="5" value="55" /></label>
      </div>
      <details class="live-source"><summary>Live input &amp; expression files</summary>
        <p>ARKit names · values 0–1 · character’s left/right</p>
        <label>Source<input data-source aria-label="Live expression source" value="Live Link Face" placeholder="Live Link Face or ws://127.0.0.1:8765" /></label>
        <button data-connect>Connect</button><button data-load-frame>Load JSON</button><button data-export-frame>Save JSON</button>
        <input type="file" data-file accept=".json,application/json" hidden />
        <p data-message role="status"></p>
      </details>
      <label class="channel-search"><input data-search type="search" aria-label="Find expression" placeholder="Find expression…" /></label>
      <div data-channels class="channel-groups"></div>
    </aside>
