<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Wave Gallery Page - Scroll-driven dual-wave gallery UI</title>
  <meta name="description" content="A cinematic scroll-driven gallery with dual-wave typography and eight moving image studies.">
  <link rel="icon" href="assets/kERMSwCuDVncwKoOheLRutVYO0o.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/untQoP6X2iTwy3X9r3h1ktLSh7g.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="gallery.css?v=face-beside-artifact">
  <link rel="stylesheet" href="intro.css">
  <link rel="preload" href="assets/satoshi-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/jizBRFtNs2ka5fXjeivQ4LroWlx-6zUTjg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/noto-serif-jp-labels.ttf" as="font" type="font/ttf" crossorigin>
  <script type="module" src="gallery.js?v=aligned-labels"></script>
  <script type="module" src="intro.js"></script>
</head>
<body data-intro-phase="hold">
  <div class="intro-shade" aria-hidden="true"></div>
  <header class="clock" aria-label="Current local date and time"><time id="live-datetime"></time></header>
  <main inert>
    <div class="gallery" role="region" aria-label="Scrolling image and text gallery">
      <div class="gallery-scroll" tabindex="0"><ul class="gallery-list"></ul></div>
      <div class="gallery-media" aria-hidden="true"></div>
      <a class="face-button" href="/face/" hidden aria-label="FACE project">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="6"/>
          <path d="M8.5 9v1m7-1v1m-7 4c1.6 2 5.4 2 7 0"/>
        </svg>
        <span class="face-label" aria-hidden="true">FACE</span>
      </a>
      <h1 class="about-name" data-visible="true">Venkatesh Annabathina</h1>
    </div>
  </main>
  <div class="badge-container">
    <a class="framer-badge" href="https://www.framer.com" rel="noopener" title="Create a free website with Framer, the website builder loved by startups, designers and agencies.">
      <span class="badge-backdrop"></span>
      <span class="badge-content"><span class="badge-logo-wrap"><img src="assets/badge-logo.svg" width="12" height="20" alt=""></span><img src="assets/badge-text.svg" width="97" height="10" alt="Made in Framer"></span>
      <span class="badge-bottom"></span><span class="badge-border"></span>
    </a>
  </div>
</body>
</html>
